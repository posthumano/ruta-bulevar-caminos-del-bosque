<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Ruta - Celebración Don Roberto</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #fdfbf7;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    #info-panel {
      padding: 16px 20px;
      background: #ffffff;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.12);
      border-top: 4px solid #d4af37;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #0b1a30;
      background: #eef2f8;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    h2 {
      margin: 0 0 6px 0;
      font-size: 18px;
      color: #0b1a30;
    }
    p {
      margin: 0 0 14px 0;
      font-size: 15px;
      color: #374151;
      line-height: 1.4;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn-primary {
      background: #0b1a30;
      color: #ffffff;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #1f2937;
    }
    .custom-label {
      background: #0b1a30;
      color: #ffffff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #d4af37;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="info-panel">
    <div class="badge" id="step-badge">Paso 1 de 3</div>
    <h2 id="step-title">Paso 1: Salida Bulevar Niza por Av. Suba</h2>
    <p id="step-desc">Tomamos la salida por la Calle 127 y continuamos por toda la Av. Suba en sentido norte pasando bajo la Boyacá.</p>
    <div class="actions">
      <button class="btn btn-secondary" onclick="prevStep()">Anterior</button>
      <button class="btn btn-primary" onclick="nextStep()">Siguiente paso ➡️</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inicializar mapa centrado en el tramo de la Av. Suba
    const map = L.map('map', { zoomControl: true }).setView([4.7185, -74.0765], 14);

    // Servidor Esri WorldStreetMap: NO bloquea, NO pide API key y carga limpio
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    // Ruta con 35 puntos exactos siguiendo la calzada real
    const realRoadPath = [
      // Salida Bulevar Niza hacia Calle 127
      [4.7083, -74.0712],
      [4.7093, -74.0722],
      // Incorporación a la Av. Suba hacia el norte
      [4.7108, -74.0728],
      [4.7126, -74.0736],
      [4.7145, -74.0744],
      [4.7165, -74.0754],
      [4.7182, -74.0763],
      [4.7198, -74.0772],
      // Curva previa al puente de la Av. Boyacá
      [4.7214, -74.0780],
      [4.7228, -74.0788],
      [4.7240, -74.0794], // Cruce bajo el puente de la Boyacá
      [4.7252, -74.0801],
      // Ascenso por la Av. Suba hacia el cerro
      [4.7266, -74.0810],
      [4.7279, -74.0820],
      [4.7291, -74.0830],
      [4.7303, -74.0841], // Frente a la estación 21 Ángeles

      // Retorno en U exacto junto a la estación 21 Ángeles
      [4.7311, -74.0847], // Desvío a la derecha hacia el retorno
      [4.7315, -74.0851], // Vértice de la curva de retorno
      [4.7314, -74.0855], // Calzada de regreso en sentido sur
      [4.7308, -74.0853], // Salida del retorno hacia la conectante local

      // Ingreso hacia la montaña y camino a Camino del Bosque
      [4.7301, -74.0857], // Desvío hacia la transversal del barrio
      [4.7294, -74.0859], // Vía local bordeando el Cerro del Tabor
      [4.7287, -74.0854], // Curva de acceso al sector residencial
      [4.7282, -74.0847]  // Portería Camino del Bosque
    ];

    // Capa base exterior oscura para resaltar sobre el fondo
    L.polyline(realRoadPath, {
      color: '#071526',
      weight: 10,
      opacity: 0.9,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    // Línea interior azul vial brillante
    L.polyline(realRoadPath, {
      color: '#0066FF',
      weight: 6,
      opacity: 1.0,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    // 3 Etapas interactivas
    const steps = [
      {
        badge: "Paso 1 de 3",
        title: "Paso 1: Salida Bulevar Niza por Av. Suba",
        desc: "Salimos hacia la Calle 127 y tomamos la Av. Suba en sentido norte pasando bajo la Boyacá rumbo al cerro.",
        coords: [4.7185, -74.0765],
        zoom: 14 // Vista amplia para ver todo el recorrido de la Av. Suba
      },
      {
        badge: "Paso 2 de 3",
        title: "Paso 2: Retorno en Estación 21 Ángeles",
        desc: "Llegando a la estación 21 Ángeles, salimos por la derecha para hacer el retorno en 'U' junto a la bomba.",
        coords: [4.7311, -74.0850],
        zoom: 17 // Acercamiento directo al retorno
      },
      {
        badge: "Paso 3 de 3",
        title: "Paso 3: Llegada a Camino del Bosque",
        desc: "Tomamos la vía local bordeando el Cerro del Tabor hasta la portería de Camino del Bosque.",
        coords: [4.7285, -74.0852],
        zoom: 17 // Acercamiento directo a la portería
      }
    ];

    // Marcadores con texto permanente
    L.marker([4.7083, -74.0712]).addTo(map)
      .bindTooltip("Inicio: Bulevar Niza", { permanent: true, direction: "top", className: "custom-label" });

    L.marker([4.7315, -74.0851]).addTo(map)
      .bindTooltip("Retorno 21 Ángeles", { permanent: true, direction: "right", className: "custom-label" });

    L.marker([4.7282, -74.0847]).addTo(map)
      .bindTooltip("Destino: Camino del Bosque", { permanent: true, direction: "top", className: "custom-label" });

    let currentStep = 0;

    function updateStep() {
      const s = steps[currentStep];
      document.getElementById('step-badge').innerText = s.badge;
      document.getElementById('step-title').innerText = s.title;
      document.getElementById('step-desc').innerText = s.desc;
      map.flyTo(s.coords, s.zoom, { duration: 1.5 });
    }

    function nextStep() {
      currentStep = (currentStep + 1) % steps.length;
      updateStep();
    }

    function prevStep() {
      currentStep = (currentStep - 1 + steps.length) % steps.length;
      updateStep();
    }
  </script>
</body>
</html>
