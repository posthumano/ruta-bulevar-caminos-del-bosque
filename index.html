<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Ruta - Celebración Don Roberto</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #ffffff;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    #info-panel {
      padding: 16px 20px;
      background: #ffffff;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.12);
      border-top: 4px solid #d4af37;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #0b1a30;
      background: #eef2f8;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    h2 {
      margin: 0 0 6px 0;
      font-size: 18px;
      color: #0b1a30;
    }
    p {
      margin: 0 0 14px 0;
      font-size: 15px;
      color: #374151;
      line-height: 1.4;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn-primary {
      background: #0b1a30;
      color: #ffffff;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #1f2937;
    }
    .custom-label {
      background: #0b1a30;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #d4af37;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="info-panel">
    <div class="badge" id="step-badge">Paso 1 de 3</div>
    <h2 id="step-title">Paso 1: Salida Bulevar Niza por Av. Suba</h2>
    <p id="step-desc">Salimos del C.C. Bulevar Niza y tomamos toda la Avenida Suba hacia el norte, pasando bajo el puente de la Av. Boyacá hasta llegar frente a la estación 21 Ángeles.</p>
    <div class="actions">
      <button class="btn btn-secondary" onclick="prevStep()">Anterior</button>
      <button class="btn btn-primary" onclick="nextStep()">Siguiente paso ➡️</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inicializar mapa
    const map = L.map('map', { zoomControl: true });

    // OpenStreetMap estándar (sin marcas de agua, sin claves de API)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Coordenadas reales
    const coordBulevar = [4.7088, -74.0716]; // Entrada Bulevar Niza sobre Calle 127
    const coordRetorno = [4.7314, -74.0844]; // Estación 21 Ángeles y retorno
    const coordDestino = [4.7298, -74.0845]; // Camino del Bosque

    // Definición de las 3 etapas secuenciales
    const steps = [
      {
        badge: "Paso 1 de 3",
        title: "Paso 1: Av. Suba desde Bulevar Niza hasta 21 Ángeles",
        desc: "Salimos del C.C. Bulevar Niza hacia la Calle 127 y avanzamos por toda la Avenida Suba hacia el norte, cruzando bajo el puente de la Av. Boyacá hasta llegar frente a 21 Ángeles.",
        bounds: [
          [4.7070, -74.0710],
          [4.7330, -74.0860]
        ]
      },
      {
        badge: "Paso 2 de 3",
        title: "Paso 2: Retorno en Estación 21 Ángeles",
        desc: "Al llegar a la estación 21 Ángeles, salimos por el costado derecho junto a la bomba de gasolina para tomar el retorno en 'U' y conectar hacia la vía de la montaña.",
        coords: [4.7314, -74.0844],
        zoom: 17
      },
      {
        badge: "Paso 3 de 3",
        title: "Paso 3: Subida a Camino del Bosque",
        desc: "Tomamos la vía que bordea el Parque Cerro del Tabor hasta llegar a la portería del Conjunto Camino del Bosque.",
        coords: [4.7298, -74.0845],
        zoom: 18
      }
    ];

    // Marcadores con nombres legibles
    L.marker(coordBulevar).addTo(map)
      .bindTooltip("1. Inicio: C.C. Bulevar Niza", { permanent: true, direction: "top", className: "custom-label" });

    L.marker(coordRetorno).addTo(map)
      .bindTooltip("2. Retorno 21 Ángeles", { permanent: true, direction: "right", className: "custom-label" });

    L.marker(coordDestino).addTo(map)
      .bindTooltip("3. Destino: Camino del Bosque", { permanent: true, direction: "top", className: "custom-label" });

    let currentStep = 0;

    function applyStep(index) {
      const s = steps[index];
      document.getElementById('step-badge').innerText = s.badge;
      document.getElementById('step-title').innerText = s.title;
      document.getElementById('step-desc').innerText = s.desc;

      if (s.bounds) {
        map.fitBounds(s.bounds, { padding: [35, 35], duration: 1.5 });
      } else {
        map.flyTo(s.coords, s.zoom, { duration: 1.5 });
      }
    }

    // Inicializar en el Paso 1
    applyStep(0);

    function nextStep() {
      currentStep = (currentStep + 1) % steps.length;
      applyStep(currentStep);
    }

    function prevStep() {
      currentStep = (currentStep - 1 + steps.length) % steps.length;
      applyStep(currentStep);
    }
  </script>
</body>
</html>
