<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Ruta - Celebración Don Roberto</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #fdfbf7;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    #info-panel {
      padding: 16px 20px;
      background: #ffffff;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.12);
      border-top: 4px solid #d4af37;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #0b1a30;
      background: #eef2f8;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    h2 {
      margin: 0 0 6px 0;
      font-size: 18px;
      color: #0b1a30;
    }
    p {
      margin: 0 0 14px 0;
      font-size: 15px;
      color: #374151;
      line-height: 1.4;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn-primary {
      background: #0b1a30;
      color: #ffffff;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #1f2937;
    }
    .custom-label {
      background: #0b1a30;
      color: #ffffff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #d4af37;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="info-panel">
    <div class="badge" id="step-badge">Paso 1 de 3</div>
    <h2 id="step-title">Salida: Av. Suba rumbo norte</h2>
    <p id="step-desc">Desde Bulevar Niza, tomamos toda la Avenida Suba hacia el norte, pasando bajo el puente de la Av. Boyacá.</p>
    <div class="actions">
      <button class="btn btn-secondary" onclick="prevStep()">Anterior</button>
      <button class="btn btn-primary" onclick="nextStep()">Siguiente paso ➡️</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. Inicializar mapa centrado para ver toda la ruta (Paso 1 por defecto)
    const map = L.map('map', { zoomControl: true }).setView([4.7190, -74.0770], 14);

    // 2. Capa base de OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 3. Coordenadas de alta precisión para calcar la vía (sin cortes rectos por los barrios)
    const preciseRoute = [
      // Salida Bulevar y empalme Av. Suba
      [4.7088, -74.0716],
      [4.7093, -74.0718],
      [4.7107, -74.0725],
      [4.7118, -74.0730],
      [4.7135, -74.0738],
      [4.7155, -74.0750],
      [4.7175, -74.0760],
      [4.7190, -74.0768],
      // Curva previa y paso bajo puente Boyacá
      [4.7205, -74.0776],
      [4.7225, -74.0786], 
      [4.7238, -74.0792], 
      [4.7258, -74.0805],
      // Ascenso hacia 21 Ángeles
      [4.7275, -74.0818],
      [4.7290, -74.0830],
      [4.7305, -74.0841], 
      
      // Giro exacto en 21 Ángeles (Retorno)
      [4.7310, -74.0844],
      [4.7314, -74.0846],
      [4.7317, -74.0849], // Punta de la oreja
      [4.7316, -74.0853],
      [4.7310, -74.0855],
      
      // Bajada e ingreso hacia Camino del Bosque
      [4.7304, -74.0858],
      [4.7295, -74.0863], // Giro izquierdo al barrio
      [4.7288, -74.0860],
      [4.7282, -74.0854],
      [4.7281, -74.0846]  // Portería Camino del Bosque
    ];

    // 4. Dibujar la ruta (Borde oscuro para resaltar)
    L.polyline(preciseRoute, {
      color: '#071526',
      weight: 10,
      opacity: 0.9,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    // 5. Dibujar la ruta (Línea azul interior)
    L.polyline(preciseRoute, {
      color: '#0066FF',
      weight: 6,
      opacity: 1.0,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    // 6. Configuración de los 3 pasos con encuadres perfectos
    const steps = [
      {
        badge: "Paso 1 de 3",
        title: "Salida: Av. Suba rumbo norte",
        desc: "Desde Bulevar Niza, tomamos toda la Avenida Suba hacia el norte, pasando bajo el puente de la Av. Boyacá.",
        coords: [4.7190, -74.0770], // Centrado en el medio de la vía para ver de inicio a fin
        zoom: 14 // Zoom alejado para ver el trayecto completo
      },
      {
        badge: "Paso 2 de 3",
        title: "Punto clave: Retorno en 21 Ángeles",
        desc: "Al llegar a la estación 21 Ángeles, salimos por la derecha y hacemos el retorno en forma de 'U' junto a la bomba.",
        coords: [4.7312, -74.0848], // Centrado exacto en la oreja del retorno
        zoom: 17 // Zoom cercano para ver la curva
      },
      {
        badge: "Paso 3 de 3",
        title: "Llegada: Camino del Bosque",
        desc: "Bajamos por la conectante e ingresamos hacia el sector del Parque Tabor hasta la portería principal.",
        coords: [4.7285, -74.0852], // Centrado entre la vía local y el conjunto
        zoom: 17 // Zoom cercano para ver la llegada
      }
    ];

    // 7. Marcadores fijos
    L.marker([4.7088, -74.0716]).addTo(map)
      .bindTooltip("Bulevar Niza", { permanent: true, direction: "right", className: "custom-label" });

    L.marker([4.7314, -74.0846]).addTo(map)
      .bindTooltip("Retorno 21 Ángeles", { permanent: true, direction: "top", className: "custom-label" });

    L.marker([4.7281, -74.0846]).addTo(map)
      .bindTooltip("Camino del Bosque", { permanent: true, direction: "bottom", className: "custom-label" });

    let currentStep = 0;

    function updateStep() {
      const s = steps[currentStep];
      document.getElementById('step-badge').innerText = s.badge;
      document.getElementById('step-title').innerText = s.title;
      document.getElementById('step-desc').innerText = s.desc;
      map.flyTo(s.coords, s.zoom, { duration: 1.5 });
    }

    function nextStep() {
      currentStep = (currentStep + 1) % steps.length;
      updateStep();
    }

    function prevStep() {
      currentStep = (currentStep - 1 + steps.length) % steps.length;
      updateStep();
    }
  </script>
</body>
</html>
