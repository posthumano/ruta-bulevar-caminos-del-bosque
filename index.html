<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Ruta - Celebración Don Roberto</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #fdfbf7;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    #info-panel {
      padding: 16px 20px;
      background: #ffffff;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.12);
      border-top: 4px solid #d4af37;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #0b1a30;
      background: #eef2f8;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    h2 {
      margin: 0 0 6px 0;
      font-size: 18px;
      color: #0b1a30;
    }
    p {
      margin: 0 0 14px 0;
      font-size: 15px;
      color: #374151;
      line-height: 1.4;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn-primary {
      background: #0b1a30;
      color: #ffffff;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #1f2937;
    }
    .custom-label {
      background: #0b1a30;
      color: #ffffff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #d4af37;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="info-panel">
    <div class="badge" id="step-badge">Paso 1 de 3</div>
    <h2 id="step-title">Paso 1: Salida Bulevar Niza por Av. Suba</h2>
    <p id="step-desc">Tomamos la Av. Suba al norte, pasando por debajo del puente de la Av. Boyacá rumbo al cerro.</p>
    <div class="actions">
      <button class="btn btn-secondary" onclick="prevStep()">Anterior</button>
      <button class="btn btn-primary" onclick="nextStep()">Siguiente paso ➡️</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inicialización del mapa
    const map = L.map('map', { zoomControl: true }).setView([4.7170, -74.0760], 14);

    // Capa base limpia de OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Trazado vial real punto a punto siguiendo las curvas de la Av. Suba
    const completeRoute = [
      // Tramo 1: Salida Bulevar Niza y calzada Av. Suba
      [4.7078, -74.0706], // Salida Bulevar
      [4.7092, -74.0718], // Calle 127
      [4.7118, -74.0730], // Av. Suba (frente a Niza Antigua)
      [4.7155, -74.0750], // Av. Suba con Calle 128
      [4.7190, -74.0768], // Curva hacia Boyacá
      [4.7215, -74.0780], // Aproximación a Boyacá
      [4.7238, -74.0792], // Puente Av. Boyacá
      [4.7258, -74.0805], // Subiendo hacia los Cerros
      [4.7275, -74.0818], // Calzada de ascenso
      [4.7290, -74.0830], // Frente a estación 21 Ángeles

      // Tramo 2: Estación 21 Ángeles y Retorno
      [4.7300, -74.0838], // Frente a la rampa de la estación
      [4.7308, -74.0843], // Carril derecho antes de la bomba
      [4.7314, -74.0846], // Entrada al retorno
      [4.7317, -74.0849], // Curva cerrada del retorno
      [4.7315, -74.0853], // Giro completo hacia el sur
      [4.7310, -74.0854], // Salida del retorno hacia la conectante

      // Tramo 3: Entrada hacia la montaña y portería Camino del Bosque
      [4.7304, -74.0858], // Conexión hacia Carrera 87 / Transversal
      [4.7295, -74.0863], // Vía de entrada local
      [4.7288, -74.0860], // Curva hacia el conjunto
      [4.7282, -74.0854], // Calle de acceso al Parque Tabor
      [4.7281, -74.0846]  // Entrada a Camino del Bosque
    ];

    // Borde oscuro exterior de alto contraste
    L.polyline(completeRoute, {
      color: '#071526',
      weight: 10,
      opacity: 0.9,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    // Línea azul vial viva
    L.polyline(completeRoute, {
      color: '#0066FF',
      weight: 6,
      opacity: 1.0,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    // 3 Etapas con zoom y encuadre exacto
    const steps = [
      {
        badge: "Paso 1 de 3",
        title: "Salida: C.C. Bulevar Niza por Av. Suba",
        desc: "Salimos hacia la Av. Suba en sentido norte, pasando por debajo del puente de la Boyacá hacia los cerros.",
        coords: [4.7170, -74.0760],
        zoom: 14
      },
      {
        badge: "Paso 2 de 3",
        title: "Retorno: Estación 21 Ángeles",
        desc: "Pasando la estación 21 Ángeles tomamos la derecha junto a la bomba para hacer el retorno e ingresar a la vía local.",
        coords: [4.7312, -74.0848],
        zoom: 17
      },
      {
        badge: "Paso 3 de 3",
        title: "Llegada: Camino del Bosque",
        desc: "Ingresamos por la vía del cerro bordeando el Parque Tabor hasta la portería de Camino del Bosque.",
        coords: [4.7281, -74.0846],
        zoom: 17
      }
    ];

    // Marcadores con etiquetas fijas en los puntos reales
    L.marker([4.7078, -74.0706]).addTo(map)
      .bindTooltip("Inicio: Bulevar Niza", { permanent: true, direction: "top", className: "custom-label" });

    L.marker([4.7314, -74.0846]).addTo(map)
      .bindTooltip("Retorno 21 Ángeles", { permanent: true, direction: "right", className: "custom-label" });

    L.marker([4.7281, -74.0846]).addTo(map)
      .bindTooltip("Destino: Camino del Bosque", { permanent: true, direction: "top", className: "custom-label" });

    let currentStep = 0;

    function updateStep() {
      const s = steps[currentStep];
      document.getElementById('step-badge').innerText = s.badge;
      document.getElementById('step-title').innerText = s.title;
      document.getElementById('step-desc').innerText = s.desc;
      map.flyTo(s.coords, s.zoom, { duration: 1.5 });
    }

    function nextStep() {
      currentStep = (currentStep + 1) % steps.length;
      updateStep();
    }

    function prevStep() {
      currentStep = (currentStep - 1 + steps.length) % steps.length;
      updateStep();
    }
  </script>
</body>
</html>
