<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Ruta - Celebración Don Roberto</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #fdfbf7;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    #info-panel {
      padding: 16px 20px;
      background: #ffffff;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.12);
      border-top: 4px solid #d4af37;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #0b1a30;
      background: #eef2f8;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    h2 {
      margin: 0 0 6px 0;
      font-size: 18px;
      color: #0b1a30;
    }
    p {
      margin: 0 0 14px 0;
      font-size: 15px;
      color: #374151;
      line-height: 1.4;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn-primary {
      background: #0b1a30;
      color: #ffffff;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #1f2937;
    }
    .custom-label {
      background: #0b1a30;
      color: #ffffff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #d4af37;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="info-panel">
    <div class="badge" id="step-badge">Paso 1 de 3</div>
    <h2 id="step-title">Salida: C.C. Bulevar Niza</h2>
    <p id="step-desc">Tomamos la salida hacia la Calle 127 e ingresamos a la calzada de la Av. Suba hacia el norte.</p>
    <div class="actions">
      <button class="btn btn-secondary" onclick="prevStep()">Anterior</button>
      <button class="btn btn-primary" onclick="nextStep()">Siguiente paso ➡️</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inicialización del mapa en Bulevar Niza
    const map = L.map('map', { zoomControl: true }).setView([4.7088, -74.0716], 15);

    // Mosaicos públicos de OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Coordenadas clave:
    // 1. Salida Bulevar Niza
    // 2. Retorno 21 Ángeles
    // 3. Destino en la parte alta de la montaña (Caminos del Bosque)
    const startPoint = [-74.0716, 4.7088];
    const via21Angeles = [-74.0844, 4.7314];
    const endPoint = [-74.0792, 4.7392];

    // Consulta directa a la API de rutas reales de OpenStreetMap (OSRM)
    const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${startPoint[0]},${startPoint[1]};${via21Angeles[0]},${via21Angeles[1]};${endPoint[0]},${endPoint[1]}?overview=full&geometries=geojson`;

    fetch(osrmUrl)
      .then(response => response.json())
      .then(data => {
        if (data.routes && data.routes.length > 0) {
          const routeGeoJSON = data.routes[0].geometry;

          // Capa exterior de alto contraste (borde negro tipo asfalto)
          L.geoJSON(routeGeoJSON, {
            style: {
              color: '#071526',
              weight: 10,
              opacity: 0.9,
              lineCap: 'round',
              lineJoin: 'round'
            }
          }).addTo(map);

          // Capa principal: Línea azul eléctrico sobre las vías exactas
          L.geoJSON(routeGeoJSON, {
            style: {
              color: '#0066FF',
              weight: 6,
              opacity: 1.0,
              lineCap: 'round',
              lineJoin: 'round'
            }
          }).addTo(map);
        }
      })
      .catch(err => console.error("Error al trazar ruta vial:", err));

    // Definición de las 3 etapas interactivas
    const steps = [
      {
        badge: "Paso 1 de 3",
        title: "Salida: C.C. Bulevar Niza",
        desc: "Tomamos la salida hacia la Av. Calle 127 e ingresamos a la Av. Suba con sentido norte.",
        coords: [4.7095, -74.0720],
        zoom: 16
      },
      {
        badge: "Paso 2 de 3",
        title: "Punto clave: 21 Ángeles y Retorno",
        desc: "Al llegar a la estación 21 Ángeles, salimos por la derecha junto a la bomba de gasolina para tomar el retorno.",
        coords: [4.7313, -74.0846],
        zoom: 17
      },
      {
        badge: "Paso 3 de 3",
        title: "Destino: Caminos del Bosque",
        desc: "Subimos por la vía principal de la montaña hasta llegar a Caminos del Bosque.",
        coords: [4.7392, -74.0792],
        zoom: 17
      }
    ];

    // Marcadores con etiquetas permanentes
    L.marker([4.7088, -74.0716]).addTo(map)
      .bindTooltip("Inicio: Bulevar Niza", { permanent: true, direction: "top", className: "custom-label" });

    L.marker([4.7314, -74.0844]).addTo(map)
      .bindTooltip("Retorno 21 Ángeles", { permanent: true, direction: "right", className: "custom-label" });

    L.marker([4.7392, -74.0792]).addTo(map)
      .bindTooltip("Destino: Caminos del Bosque", { permanent: true, direction: "top", className: "custom-label" });

    let currentStep = 0;

    function updateStep() {
      const s = steps[currentStep];
      document.getElementById('step-badge').innerText = s.badge;
      document.getElementById('step-title').innerText = s.title;
      document.getElementById('step-desc').innerText = s.desc;
      map.flyTo(s.coords, s.zoom, { duration: 1.5 });
    }

    function nextStep() {
      currentStep = (currentStep + 1) % steps.length;
      updateStep();
    }

    function prevStep() {
      currentStep = (currentStep - 1 + steps.length) % steps.length;
      updateStep();
    }
  </script>
</body>
</html>
