<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Ruta - Celebración Don Roberto</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #fdfbf7;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    #info-panel {
      padding: 18px 20px;
      background: #ffffff;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.08);
      border-top: 3px solid #d4af37;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: bold;
      color: #0b1a30;
      background: #eef2f8;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    h2 {
      margin: 0 0 6px 0;
      font-size: 19px;
      color: #0b1a30;
    }
    p {
      margin: 0 0 16px 0;
      font-size: 15px;
      color: #4a5568;
      line-height: 1.4;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn-primary {
      background: #0b1a30;
      color: #ffffff;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #1a202c;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="info-panel">
    <div class="badge" id="step-badge">Paso 1 de 3</div>
    <h2 id="step-title">Salida: Bulevar Niza</h2>
    <p id="step-desc">Salimos del centro comercial e ingresamos a la Av. Suba hacia el norte.</p>
    <div class="actions">
      <button class="btn btn-secondary" onclick="prevStep()">Anterior</button>
      <button class="btn btn-primary" onclick="nextStep()">Siguiente paso ➡️</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inicializar mapa centrado en Bulevar Niza
    const map = L.map('map', { zoomControl: false }).setView([4.712, -74.072], 16);

    // Capa de mapa limpia y elegante (CartoDB Positron)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Definición de las 3 etapas guiadas
    const steps = [
      {
        badge: "Paso 1 de 3",
        title: "Salida: C.C. Bulevar Niza",
        desc: "Tomamos la Av. Suba en sentido norte (hacia el sector de Suba).",
        coords: [4.712, -74.072],
        zoom: 16
      },
      {
        badge: "Paso 2 de 3",
        title: "Giro clave: 21 Ángeles",
        desc: "Pasando la estación 21 Ángeles, tomamos el retorno a la derecha junto a la bomba de gasolina.",
        coords: [4.733, -74.083],
        zoom: 17
      },
      {
        badge: "Paso 3 de 3",
        title: "Destino: Camino del Bosque",
        desc: "Subimos por la Cra. 87 hasta la portería del conjunto (Cra. 87 # 131C - 89).",
        coords: [4.736, -74.087],
        zoom: 18
      }
    ];

    // Marcadores visuales
    L.marker([4.712, -74.072]).addTo(map).bindPopup("<b>Inicio:</b> Bulevar Niza");
    L.marker([4.736, -74.087]).addTo(map).bindPopup("<b>Llegada:</b> Camino del Bosque");

    let currentStep = 0;

    function updateStep() {
      const s = steps[currentStep];
      document.getElementById('step-badge').innerText = s.badge;
      document.getElementById('step-title').innerText = s.title;
      document.getElementById('step-desc').innerText = s.desc;
      map.flyTo(s.coords, s.zoom, { duration: 1.5 });
    }

    function nextStep() {
      currentStep = (currentStep + 1) % steps.length;
      updateStep();
    }

    function prevStep() {
      currentStep = (currentStep - 1 + steps.length) % steps.length;
      updateStep();
    }
  </script>
</body>
</html>
