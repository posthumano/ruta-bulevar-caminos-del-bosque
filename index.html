<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Ruta - Celebración Don Roberto</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #fdfbf7;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    #info-panel {
      padding: 16px 20px;
      background: #ffffff;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.12);
      border-top: 4px solid #d4af37;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #0b1a30;
      background: #eef2f8;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    h2 {
      margin: 0 0 6px 0;
      font-size: 18px;
      color: #0b1a30;
    }
    p {
      margin: 0 0 14px 0;
      font-size: 15px;
      color: #374151;
      line-height: 1.4;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn-primary {
      background: #0b1a30;
      color: #ffffff;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #1f2937;
    }
    .custom-label {
      background: #0b1a30;
      color: #ffffff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #d4af37;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="info-panel">
    <div class="badge" id="step-badge">Paso 1 de 3</div>
    <h2 id="step-title">Salida: C.C. Bulevar Niza</h2>
    <p id="step-desc">Tomamos la Av. Suba rumbo norte, pasando bajo el puente de la Boyacá hacia la montaña.</p>
    <div class="actions">
      <button class="btn btn-secondary" onclick="prevStep()">Anterior</button>
      <button class="btn btn-primary" onclick="nextStep()">Siguiente paso ➡️</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inicializar mapa
    const map = L.map('map', { zoomControl: true }).setView([4.7088, -74.0716], 15);

    // Mosaicos limpios de OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Trazado CONTINUO y COMPLETO de inicio a fin sobre las vías exactas
    const completeRoute = [
      // Tramo 1: Salida Bulevar Niza y Av. Suba
      [4.7078, -74.0706],
      [4.7092, -74.0718],
      [4.7107, -74.0725],
      [4.7135, -74.0738],
      [4.7175, -74.0757],
      [4.7210, -74.0775],
      [4.7248, -74.0795], // Puente Boyacá
      [4.7285, -74.0817], // Subida cerro
      [4.7310, -74.0835], // Curva previa a 21 Ángeles

      // Tramo 2: Área 21 Ángeles y curva de retorno junto a la bomba
      [4.7332, -74.0848], // Frente a estación 21 Ángeles
      [4.7346, -74.0858], // Desvío a la derecha para tomar oreja
      [4.7350, -74.0863], // Punto alto del giro / retorno
      [4.7343, -74.0868], // Calzada de regreso / bajada
      [4.7328, -74.0858], // Conexión hacia la vía del cerro

      // Tramo 3: Entrada a la montaña directo hacia Camino del Bosque
      [4.7319, -74.0854],
      [4.7312, -74.0850],
      [4.7305, -74.0847], // Vía junto al Parque Cerro del Tabor
      [4.7298, -74.0845]  // Entrada a Camino del Bosque
    ];

    // Borde negro de contraste
    L.polyline(completeRoute, {
      color: '#071526',
      weight: 10,
      opacity: 0.9,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    // Línea azul continua
    L.polyline(completeRoute, {
      color: '#0066FF',
      weight: 6,
      opacity: 1.0,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    // Configuración calibrada de los 3 pasos
    const steps = [
      {
        badge: "Paso 1 de 3",
        title: "Salida: C.C. Bulevar Niza",
        desc: "Salimos hacia la Calle 127 y tomamos la calzada de la Av. Suba rumbo al norte hacia el cerro.",
        coords: [4.7140, -74.0740],
        zoom: 15
      },
      {
        badge: "Paso 2 de 3",
        title: "Giro clave: Estación 21 Ángeles",
        desc: "Llegando a la estación 21 Ángeles, tomamos el retorno a la derecha para empalmar hacia el acceso del cerro.",
        coords: [4.7335, -74.0855],
        zoom: 17
      },
      {
        badge: "Paso 3 de 3",
        title: "Llegada: Camino del Bosque",
        desc: "Ingresamos hacia el sector del cerro junto al Parque Tabor hasta la portería de Camino del Bosque.",
        coords: [4.7298, -74.0845],
        zoom: 17
      }
    ];

    // Marcadores con etiquetas fijas en las ubicaciones exactas
    L.marker([4.7078, -74.0706]).addTo(map)
      .bindTooltip("Inicio: Bulevar Niza", { permanent: true, direction: "top", className: "custom-label" });

    L.marker([4.7335, -74.0855]).addTo(map)
      .bindTooltip("Retorno 21 Ángeles", { permanent: true, direction: "left", className: "custom-label" });

    L.marker([4.7298, -74.0845]).addTo(map)
      .bindTooltip("Destino: Camino del Bosque", { permanent: true, direction: "top", className: "custom-label" });

    let currentStep = 0;

    function updateStep() {
      const s = steps[currentStep];
      document.getElementById('step-badge').innerText = s.badge;
      document.getElementById('step-title').innerText = s.title;
      document.getElementById('step-desc').innerText = s.desc;
      map.flyTo(s.coords, s.zoom, { duration: 1.5 });
    }

    function nextStep() {
      currentStep = (currentStep + 1) % steps.length;
      updateStep();
    }

    function prevStep() {
      currentStep = (currentStep - 1 + steps.length) % steps.length;
      updateStep();
    }
  </script>
</body>
</html>
