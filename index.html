<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Ruta - Celebración Don Roberto</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #fdfbf7;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    #info-panel {
      padding: 16px 20px;
      background: #ffffff;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.12);
      border-top: 4px solid #d4af37;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #0b1a30;
      background: #eef2f8;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    h2 {
      margin: 0 0 6px 0;
      font-size: 18px;
      color: #0b1a30;
    }
    p {
      margin: 0 0 14px 0;
      font-size: 15px;
      color: #374151;
      line-height: 1.4;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn-primary {
      background: #0b1a30;
      color: #ffffff;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #1f2937;
    }
    .custom-label {
      background: #0b1a30;
      color: #ffffff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #d4af37;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="info-panel">
    <div class="badge" id="step-badge">Paso 1 de 3</div>
    <h2 id="step-title">Paso 1: Desde Bulevar Niza hasta 21 Ángeles</h2>
    <p id="step-desc">Salimos de Bulevar Niza por la Av. Calle 127 y tomamos toda la Av. Suba rumbo norte, pasando bajo el puente de la Boyacá hacia la estación 21 Ángeles.</p>
    <div class="actions">
      <button class="btn btn-secondary" onclick="prevStep()">Anterior</button>
      <button class="btn btn-primary" onclick="nextStep()">Siguiente paso ➡️</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inicializar mapa
    const map = L.map('map', { zoomControl: true });

    // Servidor Esri (nítido, sin bloqueo 403 y sin marcas de agua)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    // Configuración de los 3 pasos con encuadres y zooms específicos
    const steps = [
      {
        badge: "Paso 1 de 3",
        title: "Paso 1: Desde Bulevar Niza hasta 21 Ángeles",
        desc: "Salimos de Bulevar Niza hacia la Calle 127 y avanzamos por toda la Av. Suba hacia el norte, cruzando bajo la Boyacá hasta aproximarnos a la estación 21 Ángeles.",
        // Encuadre que muestra ambos puntos a la vez (Bulevar abajo y 21 Ángeles arriba)
        bounds: [
          [4.7070, -74.0725],
          [4.7325, -74.0850]
        ]
      },
      {
        badge: "Paso 2 de 3",
        title: "Paso 2: Retorno en 21 Ángeles y desvío al cerro",
        desc: "Llegando a la estación 21 Ángeles, tomamos la salida a la derecha junto a la bomba para hacer el retorno en 'U' y empalmar con la vía de acceso hacia la montaña.",
        coords: [4.7315, -74.0848],
        zoom: 17
      },
      {
        badge: "Paso 3 de 3",
        title: "Paso 3: Llegada a Camino del Bosque",
        desc: "Subimos por la vía local junto al Parque Cerro del Tabor hasta llegar directamente a la portería del Conjunto Camino del Bosque.",
        coords: [4.7298, -74.0845],
        zoom: 18
      }
    ];

    // Marcadores visuales fijos en los puntos clave
    L.marker([4.7088, -74.0716]).addTo(map)
      .bindTooltip("1. Inicio: Bulevar Niza", { permanent: true, direction: "top", className: "custom-label" });

    L.marker([4.7314, -74.0844]).addTo(map)
      .bindTooltip("2. Retorno 21 Ángeles", { permanent: true, direction: "right", className: "custom-label" });

    L.marker([4.7298, -74.0845]).addTo(map)
      .bindTooltip("3. Destino: Camino del Bosque", { permanent: true, direction: "top", className: "custom-label" });

    let currentStep = 0;

    function applyStep(index) {
      const s = steps[index];
      document.getElementById('step-badge').innerText = s.badge;
      document.getElementById('step-title').innerText = s.title;
      document.getElementById('step-desc').innerText = s.desc;

      if (s.bounds) {
        map.fitBounds(s.bounds, { padding: [40, 40], duration: 1.5 });
      } else {
        map.flyTo(s.coords, s.zoom, { duration: 1.5 });
      }
    }

    // Cargar paso 1 de inicio
    applyStep(0);

    function nextStep() {
      currentStep = (currentStep + 1) % steps.length;
      applyStep(currentStep);
    }

    function prevStep() {
      currentStep = (currentStep - 1 + steps.length) % steps.length;
      applyStep(currentStep);
    }
  </script>
</body>
</html>
